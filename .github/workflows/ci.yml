name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: CGO_ENABLED=0 go build -o devlog ./cmd/devlog

      - name: Test
        run: go test -coverprofile=coverage.out ./...

      - name: Vet
        run: go vet ./...

      - name: Upload coverage to test-lens
        uses: foestauf/test-lens-upload@v0.4.0
        continue-on-error: true
